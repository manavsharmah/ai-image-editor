<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Photo Look Editor</title>
    <link rel="stylesheet" href="css/styles.css">
    <script type="module" src="js/editor.js"></script>
  </head>
  <body>
    <header>
      <h1>AI Photo Look Editor</h1>
      <p id="status" role="status"></p>
      <button id="choose" type="button">Choose photo</button>
      <select id="format" aria-label="Download format" autocomplete="off" disabled>
        <option value="image/jpeg">JPG</option>
        <option value="image/png">PNG</option>
      </select>
      <button id="download" type="button" class="primary" autocomplete="off" disabled>Download</button>
      <input id="file" type="file" accept="image/jpeg,image/png,image/webp" hidden>
    </header>
    <main>
      <section id="stage" aria-label="Photo preview">
        <canvas id="view" hidden></canvas>
        <button id="drop" type="button">
          <strong>Drop a photo here, or click to choose</strong>
          <span>JPG, PNG or WebP. Your photo never leaves this browser.</span>
        </button>
      </section>
      <aside aria-label="Adjustments">
        <!-- Disabled until a photo is open. Sliders are generated by editor.js. -->
        <fieldset id="panel" disabled>
          <!-- Only this text is sent to the server, never the photo. -->
          <form id="prompt-form" class="prompt">
            <label for="prompt">Describe a look</label>
            <div class="prompt-row">
              <input id="prompt" type="text" maxlength="300" autocomplete="off" placeholder="e.g. warm and moody">
              <button id="prompt-apply" type="submit" class="primary">Apply</button>
            </div>
            <p id="prompt-status" role="status" aria-live="polite"></p>
          </form>
          <div class="panel-top">
            <small>Double-click a slider to reset it</small>
            <button id="reset" type="button">Reset</button>
          </div>
          <div id="sliders"></div>
        </fieldset>
        <!-- Debug only: measured in this browser from small copies, never uploaded. -->
        <details id="stats-debug" class="stats-debug">
          <summary>Image statistics (debug)</summary>
          <div class="stats-top">
            <button id="choose-reference" type="button">Choose reference</button>
            <input id="reference-file" type="file" accept="image/jpeg,image/png,image/webp" hidden>
          </div>
          <div class="stats-grid">
            <section id="stats-source" aria-label="Source photo statistics">
              <h3>Source</h3>
              <p class="stats-msg" role="status" aria-live="polite"></p>
              <div class="stats-body"></div>
            </section>
            <section id="stats-reference" aria-label="Reference photo statistics">
              <h3>Reference</h3>
              <p class="stats-msg" role="status" aria-live="polite"></p>
              <div class="stats-body"></div>
            </section>
          </div>
        </details>
      </aside>
    </main>
  </body>
</html>
